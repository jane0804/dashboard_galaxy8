
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>휴대폰 일별 판매 예측 대시보드 주소 변경</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      background: #f8f9fa;
      color: #2d3436;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: #fff;
      border: 1px solid #dfe6e9;
      border-radius: 16px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.06);
    }

    .icon {
      font-size: 38px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 21px;
      margin-bottom: 12px;
      color: #1a1a2e;
    }

    .description {
      font-size: 14px;
      color: #636e72;
      line-height: 1.7;
      margin-bottom: 24px;
    }

    .new-url {
      background: #f1f3f5;
      border-radius: 8px;
      padding: 12px;
      font-size: 11px;
      color: #636e72;
      word-break: break-all;
      margin-bottom: 20px;
    }

    .button {
      display: inline-block;
      background: #FAE100;
      color: #1a1a2e;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
    }

    .countdown {
      font-size: 12px;
      color: #b2bec3;
      margin-top: 16px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="icon">📱</div>

    <h1>대시보드 주소가 변경되었습니다</h1>

    <div class="description">
      휴대폰 일별 판매 예측 대시보드의<br>
      운영 주소가 변경되었습니다.<br><br>
      새로운 대시보드로 이동합니다.
    </div>

    <div class="new-url">
      https://script.google.com/a/macros/kakaoinsurecorp.com/s/AKfycbw6q2zOCYeusG2vrtklS5GXb9KNTBO870WdxOKleZXGGhc6VAEYZIE-2ruEZfd1oSX8zA/exec
    </div>

    <a
      class="button"
      href="https://script.google.com/a/macros/kakaoinsurecorp.com/s/AKfycbw6q2zOCYeusG2vrtklS5GXb9KNTBO870WdxOKleZXGGhc6VAEYZIE-2ruEZfd1oSX8zA/exec">
      새 대시보드 바로가기
    </a>

    <div class="countdown">
      <span id="seconds">3</span>초 후 자동으로 이동합니다.
    </div>

  </div>

  <script>
    const NEW_URL =
      'https://script.google.com/a/macros/kakaoinsurecorp.com/s/AKfycbw6q2zOCYeusG2vrtklS5GXb9KNTBO870WdxOKleZXGGhc6VAEYZIE-2ruEZfd1oSX8zA/exec';

    let seconds = 3;

    const timer = setInterval(() => {
      seconds--;

      document.getElementById('seconds').textContent = seconds;

      if (seconds <= 0) {
        clearInterval(timer);
        window.location.replace(NEW_URL);
      }
    }, 1000);
  </script>

</body>
</html>
