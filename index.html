// === DATA PROCESSING ===
const PRODUCTS = Object.keys(RAW);
const METRICS = ['계약건수','보험료','피보험자'];
const METRIC_LABELS = {'계약건수':'판매건수 (건)','보험료':'보험료 (백만원)','피보험자':'피보험자수 (명)'};

function getAllMonths(){
  const s = new Set();
  for(const p of PRODUCTS) for(const m of METRICS) for(const c of ['카카오','삼성']){
    const d = RAW[p]?.[m]?.[c];
    if(d) Object.keys(d).forEach(k=>s.add(k));
  }
  return [...s].sort();
}
const ALL_MONTHS = getAllMonths();

function getVal(product,metric,company,month){
  const v = RAW[product]?.[metric]?.[company]?.[month];
  if(v===undefined||v===null||v==='') return null;
  return Number(v);
}

function gap(k,s){ if(k===null||s===null) return null; return k-s; }
function gapRate(k,s){ if(k===null||s===null||s===0) return null; return k/s; }
function yoy(product,metric,company,month){
  const cur = getVal(product,metric,company,month);
  const prev = getVal(product,metric,company,String(Number(month)-100));
  if(cur===null||prev===null||prev===0) return null;
  return cur/prev-1;
}

// 합산용: 상품전체=해외여행+장기체류+운전자+자녀 합산, 기준월전체=해당상품 전월합산
const SUM_PRODUCTS = ['해외여행','장기체류','운전자','자녀'];
function getAggVal(product,metric,company,month){
  // 단일 상품+단일 월
  if(product!=='전체'&&month!=='전체') return getVal(product,metric,company,month);
  // 상품 전체 + 단일 월
  if(product==='전체'&&month!=='전체'){
    let sum=0,hasAny=false;
    for(const p of SUM_PRODUCTS){const v=getVal(p,metric,company,month);if(v!==null){sum+=v;hasAny=true;}}
    return hasAny?sum:null;
  }
  // 단일 상품 + 월 전체
  if(product!=='전체'&&month==='전체'){
    let sum=0,hasAny=false;
    for(const m of ALL_MONTHS){const v=getVal(product,metric,company,m);if(v!==null){sum+=v;hasAny=true;}}
    return hasAny?sum:null;
  }
  // 둘 다 전체
  let sum=0,hasAny=false;
  for(const p of SUM_PRODUCTS) for(const m of ALL_MONTHS){const v=getVal(p,metric,company,m);if(v!==null){sum+=v;hasAny=true;}}
  return hasAny?sum:null;
}
function aggYoy(product,metric,company,month){
  if(month==='전체') return null;
  const cur=getAggVal(product,metric,company,month);
  const prevMonth=String(Number(month)-100);
  const prev=getAggVal(product,metric,company,prevMonth);
  if(cur===null||prev===null||prev===0) return null;
  return cur/prev-1;
}

function fmt(v,type){
  if(v===null) return 'N/A';
  if(type==='pct') return (v*100).toFixed(1)+'%';
  if(type==='pp') return (v*100).toFixed(1)+'%p';
  if(type==='ratio') return v.toFixed(2)+'x';
  if(type==='num') return v.toLocaleString('ko-KR');
  if(type==='num_건') return v.toLocaleString('ko-KR')+' 건';
  if(type==='num_백만') return v.toLocaleString('ko-KR')+' 백만원';
  if(type==='num_명') return v.toLocaleString('ko-KR')+' 명';
  return String(v);
}
function numFmt(metric){ return metric==='계약건수'?'num_건':metric==='보험료'?'num_백만':'num_명'; }

let sortCol=-1,sortAsc=true;
function renderTable(month,metric){
  const isAllMonth = month==='전체';
  const isAllProduct = fProduct.value==='전체';
  const hideYoY = isAllMonth;
  const productList = isAllProduct ? PRODUCTS : [fProduct.value];
  const monthLabel = isAllMonth?'전체 기간':month.slice(0,4)+'.'+month.slice(4);
  document.getElementById('tblTitle').textContent='📊 '+monthLabel+' 기준 · '+METRIC_LABELS[metric]+' · 상품별 실적 비교';
  const rows=[];
  for(const p of productList){
    const kv=getAggVal(p,metric,'카카오',month);
    const sv=getAggVal(p,metric,'삼성',month);
    const g=gap(kv,sv),gr=gapRate(kv,sv);
    const ky=hideYoY?null:aggYoy(p,metric,'카카오',month);
    const sy=hideYoY?null:aggYoy(p,metric,'삼성',month);
    const yg=(ky!==null&&sy!==null)?ky-sy:null;
    // Recent 3-month gap rate direction
    const mi=ALL_MONTHS.indexOf(month);
    let trend='';
    if(!isAllMonth&&mi>=2){
      const gr1=gapRate(getVal(p,metric,'카카오',ALL_MONTHS[mi-2]),getVal(p,metric,'삼성',ALL_MONTHS[mi-2]));
      const gr3=gr;
      if(gr1!==null&&gr3!==null){trend=gr3>gr1?'↑ 확대':gr3<gr1?'↓ 축소':'→ 유지';}
      else trend='-';
    }else trend='-';
    let note='';
    if(kv===null&&sv===null&&!isAllMonth) note='데이터 없음';
    else if(kv===null&&!isAllMonth) note='카카오 데이터 없음';
    else if(sv===null&&!isAllMonth) note='삼성 데이터 없음';
    rows.push([p,kv,sv,g,gr,trend,ky,sy,yg,note]);
  }
  if(sortCol>=0){rows.sort((a,b)=>{
    let av=a[sortCol+1],bv=b[sortCol+1];
    if(av===null) av=sortAsc?Infinity:-Infinity;
    if(bv===null) bv=sortAsc?Infinity:-Infinity;
    if(typeof av==='string') return sortAsc?av.localeCompare(bv):bv.localeCompare(av);
    return sortAsc?av-bv:bv-av;
  });}else if(!hideYoY){rows.sort((a,b)=>(b[8]||0)-(a[8]||0));}

  const hdr=hideYoY?['상품','카카오','삼성','Gap','Gap배수','Gap3개월추이','비고']:['상품','카카오','삼성','Gap','Gap배수','Gap3개월추이','카카오YoY','삼성YoY','YoY Gap','비고'];
  const thead=document.querySelector('#tbl thead');
  thead.innerHTML='<tr>'+hdr.map((h,i)=>`<th data-col="${i}">${h}</th>`).join('')+'</tr>';
  thead.querySelectorAll('th').forEach(th=>{th.onclick=()=>{
    const c=Number(th.dataset.col);
    if(sortCol===c)sortAsc=!sortAsc;else{sortCol=c;sortAsc=true;}
    renderTable(fMonth.value,fMetric.value);
  }});
  const tbody=document.querySelector('#tbl tbody');
  tbody.innerHTML=rows.map(r=>{
    if(hideYoY){
      return `<tr>
        <td>${r[0]}</td>
        <td>${fmt(r[1],numFmt(metric))}</td>
        <td>${fmt(r[2],numFmt(metric))}</td>
        <td class="${r[3]!==null?(r[3]>=0?'positive':'negative'):''}">${fmt(r[3],numFmt(metric))}</td>
        <td class="${r[4]!==null?(r[4]>=1?'positive':'negative'):''}">${fmt(r[4],'ratio')}</td>
        <td>${r[5]}</td>
        <td style="font-size:11px;color:#636e72">${r[9]}</td>
      </tr>`;
    }
    return `<tr>
      <td>${r[0]}</td>
      <td>${fmt(r[1],numFmt(metric))}</td>
      <td>${fmt(r[2],numFmt(metric))}</td>
      <td class="${r[3]!==null?(r[3]>=0?'positive':'negative'):''}">${fmt(r[3],numFmt(metric))}</td>
      <td class="${r[4]!==null?(r[4]>=1?'positive':'negative'):''}">${fmt(r[4],'ratio')}</td>
      <td>${r[5]}</td>
      <td class="${r[6]!==null?(r[6]>=0?'positive':'negative'):''}">${fmt(r[6],'pct')}</td>
      <td class="${r[7]!==null?(r[7]>=0?'positive':'negative'):''}">${fmt(r[7],'pct')}</td>
      <td class="${r[8]!==null?(r[8]>=0?'positive':'negative'):''}">${fmt(r[8],'pp')}</td>
      <td style="font-size:11px;color:#636e72">${r[9]}</td>
    </tr>`;
  }).join('');
}
// Event listeners
fMonth.addEventListener('change',render);
fProduct.addEventListener('change',()=>{
  const p=fProduct.value;
  const piOpt=fMetric.querySelector('option[value="피보험자"]');
  if(p==='해외여행'||p==='전체'){piOpt.style.display='';}
  else{piOpt.style.display='none';if(fMetric.value==='피보험자')fMetric.value='계약건수';}
  render();
});
fMetric.addEventListener('change',render);
render();
</script>
</body>
</html>
